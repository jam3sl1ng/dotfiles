# ===================================================
#
#                [ hyprlock config ]
#
# ===================================================
#
# hyprlock uses hyprlang (.conf), not Lua.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Test with: hyprlock

general {
    hide_cursor = true
}

# Blurred screenshot of the desktop as the background.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    contrast = 1.0
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb(ebdbb2)
    font_size = 96
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

# Username, in the Gruvbox orange from general.lua
label {
    monitor =
    text = $USER
    color = rgb(d65d0e)
    font_size = 20
    font_family = JetBrains Mono
    # y offset from center: smaller = further down / more gap under the clock
    position = 0, 110
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(ebdbb2)
    inner_color = rgb(272727)
    font_color = rgb(ebdbb2)
    fade_on_empty = false
    placeholder_text = Password...
    position = 0, -80
    halign = center
    valign = center
}
