# ===================================================
#
#                [ hypridle config ]
#
# ===================================================
#
# hypridle is a separate program from Hyprland, so it
# still uses hyprlang (.conf) even though Hyprland 0.55+
# uses Lua for hyprland.lua.
#
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Run when something requests a lock (loginctl lock-session, dbus, etc.)
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before the machine suspends.
    before_sleep_cmd = loginctl lock-session

    # Turn the panel back on after resume without needing a key press.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'

    # Respect idle inhibitors (video players, browsers, Steam, ...).
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# ---------------------------------------------------
# Lock the screen after 5 minutes of idle.
# Change `timeout` (seconds) to whatever you want.
# ---------------------------------------------------
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# ---------------------------------------------------
# Optional: power the display off after 10 minutes.
# Comment this block out if you want the lock screen
# to stay visible instead.
# ---------------------------------------------------
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
